[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autobench"
version = "0.1.0"
description = "Automated evaluation framework for local GGUF LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
