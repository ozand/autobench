<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoBench: Dual-GPU LLM Benchmark Results (k7000)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --badge-green: #22c55e;
            --badge-amber: #f59e0b;
            --badge-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }
        h1 { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--text-muted); font-size: 1rem; }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        input, select {
            background-color: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        .table-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }
        th:hover { color: var(--accent); }
        tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-green { background: rgba(34, 197, 94, 0.2); color: var(--badge-green); }
        .badge-amber { background: rgba(245, 158, 11, 0.2); color: var(--badge-amber); }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: var(--badge-red); }
        .speed-val { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ AutoBench: Матрица производительности GGUF (k7000)</h1>
            <p class="subtitle">Стенд: Dual GTX 690 (Kepler Vulkan 2×2GB) • Режим кэша: --no-kv-offload • Тестирование контекста и квантования</p>
        </header>

        <div class="controls">
            <input type="text" id="search" placeholder="🔍 Поиск по модели..." oninput="filterTable()">
            <select id="device-filter" onchange="filterTable()">
                <option value="all">Все устройства</option>
                <option value="Vulkan0">Vulkan0 (1 карта)</option>
                <option value="Vulkan1">Vulkan1 (1 карта)</option>
                <option value="1_1">Dual-GPU (1,1)</option>
            </select>
            <select id="ctx-filter" onchange="filterTable()">
                <option value="all">Все контексты</option>
                <option value="1024">1024 (1K)</option>
                <option value="2048">2048 (2K)</option>
                <option value="4096">4096 (4K)</option>
                <option value="8192">8192 (8K)</option>
                <option value="16384">16384 (16K)</option>
                <option value="32768">32768 (32K)</option>
            </select>
        </div>

        <div class="table-container">
            <table id="bench-table">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Модель</th>
                        <th onclick="sortTable(1)">Устройство</th>
                        <th onclick="sortTable(2)">Контекст</th>
                        <th onclick="sortTable(3)">Квант кэша</th>
                        <th onclick="sortTable(4)">Prompt (t/s)</th>
                        <th onclick="sortTable(5)">Gen (t/s)</th>
                        <th onclick="sortTable(6)">Retrieval (%)</th>
                        <th onclick="sortTable(7)">Качество (%)</th>
                        <th onclick="sortTable(8)">Статус</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Заполняется JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let benchmarkData = [];

        async function loadData() {
            try {
                const res = await fetch('benchmarks_data.json');
                benchmarkData = await res.json();
                renderTable(benchmarkData);
            } catch (err) {
                console.error("Ошибка загрузки данных:", err);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach(row => {
                const tr = document.createElement('tr');
                const promptSpeed = row.prompt_tokens_per_sec ? row.prompt_tokens_per_sec.toFixed(1) : '-';
                const genSpeed = row.eval_tokens_per_sec ? row.eval_tokens_per_sec.toFixed(1) : '-';
                const retrieval = row.retrieval_rate !== null && row.retrieval_rate !== undefined 
                    ? (row.retrieval_rate * 100).toFixed(1) + '%' : '-';
                const quality = row.quality_pass_rate !== null && row.quality_pass_rate !== undefined 
                    ? (row.quality_pass_rate * 100).toFixed(0) + '%' : '-';

                let statusBadge = `<span class="badge badge-green">PASS</span>`;
                if (row.status === 'PARTIAL_FAILURE') {
                    statusBadge = `<span class="badge badge-amber">PARTIAL</span>`;
                } else if (row.status === 'FAILED' || row.status === 'OOM') {
                    statusBadge = `<span class="badge badge-red">${row.status}</span>`;
                }

                tr.innerHTML = `
                    <td><strong>${row.model_name}</strong></td>
                    <td>${row.device} ${row.tensor_split !== 'none' ? '(' + row.tensor_split + ')' : ''}</td>
                    <td>${row.context_length}</td>
                    <td>${row.kv_quant || 'f16'}</td>
                    <td class="speed-val">${promptSpeed}</td>
                    <td class="speed-val">${genSpeed}</td>
                    <td>${retrieval}</td>
                    <td>${quality}</td>
                    <td>${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const query = document.getElementById('search').value.toLowerCase();
            const dev = document.getElementById('device-filter').value;
            const ctx = document.getElementById('ctx-filter').value;

            const filtered = benchmarkData.filter(row => {
                const matchName = row.model_name.toLowerCase().includes(query);
                const matchDev = dev === 'all' || (dev === '1_1' ? (row.tensor_split && row.tensor_split.includes('1,1')) : row.device.includes(dev));
                const matchCtx = ctx === 'all' || row.context_length.toString() === ctx;
                return matchName && matchDev && matchCtx;
            });

            renderTable(filtered);
        }

        loadData();
    </script>
</body>
</html>
